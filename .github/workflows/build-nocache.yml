name: Build No Cache

on:
  workflow_dispatch:

  # schedule:
  #   - cron: '30 12 * * 0'
    # Will run once a week on Sunday afternoon

jobs:
  build-no-cache:
    permissions:
      packages: write
    env:
      DOCKER_REPOSITORY: ghcr.io/dfe-digital/get-information-pupils.service.gov.uk
    outputs:
      docker-image-tag: ${{ steps.build-image.outputs.tag }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      name: Checkout
      
    - name: Add DfEDigital NuGet Feed Credentials
      run: |
        dotnet nuget update source dfedigital \
          --configfile ./app/nuget.config \
          --username USERNAME \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text      

    - name: Build without cache and push docker image
      id: build-image
      uses: DFE-Digital/github-actions/build-docker-image@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        context: ./app
        dockerfile-path: ./app/Dockerfile
        docker-repository: ${{ env.DOCKER_REPOSITORY }}
        max-cache: true
        reuse-cache: false
        snyk-token: ${{ secrets.SNYK_TOKEN }}
        secret-files: nuget_config=./app/nuget.config
        
    - name: Notify teams channel on job failure
      if: ${{ failure() }}
      uses: DFE-Digital/github-actions/send-to-teams-channel@master
      with:
        teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        title: "Build failure"
        service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
        message: |
          "Rebuild docker cache failure"
