name: Build and Deploy AKS
concurrency: build_and_deploy_${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      docker-image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        type: choice
        default: development
        options:
        - development
        - test
        #- staging
        #- production
      docker-image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
      pull-request-number:
        description: "Pull request number (required for review environment)"
        required: false
        type: string
