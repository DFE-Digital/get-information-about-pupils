name: Deploy AKS environment
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read  # Required to check out the code.
      packages: write # Required to restore private packages and push to GHCR.

  deploy:
    name: Deploy to AKS
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to check out the code.
      id-token: write # Required for OIDC authentication with Azure.
    concurrency: deploy_aks_${{ inputs.environment }}

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.environment_url }}

    steps:
      - name: Deploy to AKS
        id: deploy
        uses: DFE-Digital/github-actions/deploy-to-aks@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID_AKS }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_AKS }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          environment: ${{ inputs.environment }}
          sha: ${{ github.sha }}
          terraform-base: terraform/application
          healthcheck: health
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          smoke-test: true
          gcp-wip: ${{ vars.GCP_WIP }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
