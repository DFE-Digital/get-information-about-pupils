name: Deploy environment
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    secrets: inherit

  deploy:
    name: Deploy to Azure App Service
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    concurrency: deploy_${{ inputs.environment }}

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy_app_service.outputs.webapp-url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ./app-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy_app_service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          package: ./app-package
