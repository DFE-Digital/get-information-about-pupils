name: Deploy environment
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read  # Required to check out the code.
      packages: write # Required to restore private packages and push to GHCR.

  deploy:
    name: Deploy to Azure App Service
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to check out the code (for the smoke-test action).
      id-token: write # Required for OIDC authentication with Azure
    concurrency: deploy_${{ inputs.environment }}

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Azure
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app_name: ${{ vars.AZURE_APP_NAME }}
          artifact_name: ${{ needs.package.outputs.artifact_name }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_aks:
    name: Deploy to AKS
    needs: [package]
    if: ${{ contains(fromJSON('["development", "test"]'), inputs.environment) }}
    uses: ./.github/workflows/build-and-deploy.yml

    secrets:
      AZURE_CLIENT_ID_AKS: ${{ secrets.AZURE_CLIENT_ID_AKS }}
      AZURE_SUBSCRIPTION_ID_AKS: ${{ secrets.AZURE_SUBSCRIPTION_ID_AKS }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    permissions:
      id-token: write
      contents: read
      packages: write
      pull-requests: write
    with:
      docker-image-tag: ${{ github.sha }}
      environment: ${{ inputs.environment }}
