name: Build & deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read  # Required to check out the code.
      packages: read  # Required to access the DfE-Digital NuGet feed.

  deploy_development:
    name: Deploy development environment
    needs: [package]
    runs-on: ubuntu-latest
    concurrency: deploy_development

    permissions:
      contents: read  # Required to check out the code.
      id-token: write # Required for OIDC authentication with Azure.

    environment:
      name: development
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Azure
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app_name: ${{ vars.AZURE_APP_NAME }}
          artifact_name: ${{ needs.package.outputs.artifact_name }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_test:
    name: Deploy test environment
    needs: [package, deploy_development]
    runs-on: ubuntu-latest
    concurrency: deploy_test

    permissions:
      contents: read  # Required to check out the code.
      id-token: write # Required for OIDC authentication with Azure.

    environment:
      name: test
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Azure
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app_name: ${{ vars.AZURE_APP_NAME }}
          artifact_name: ${{ needs.package.outputs.artifact_name }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_preproduction:
    name: Deploy pre-production environment
    needs: [package, deploy_test]
    runs-on: ubuntu-latest
    concurrency: deploy_preproduction

    permissions:
      contents: read  # Required to check out the code.
      id-token: write # Required for OIDC authentication with Azure.

    environment:
      name: preproduction
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Azure
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app_name: ${{ vars.AZURE_APP_NAME }}
          artifact_name: ${{ needs.package.outputs.artifact_name }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_production:
    name: Deploy production environment
    needs: [package, deploy_preproduction]
    runs-on: ubuntu-latest
    concurrency: deploy_production

    permissions:
      contents: read  # Required to check out the code.
      id-token: write # Required for OIDC authentication with Azure.

    environment:
      name: production
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Azure
        id: deploy
        uses: ./.github/actions/deploy
        with:
          app_name: ${{ vars.AZURE_APP_NAME }}
          artifact_name: ${{ needs.package.outputs.artifact_name }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
