name: Package application

on:
  workflow_call:
    outputs:
      artifact_name:
        value: web_package
      docker_image:
        value: ${{ jobs.package.outputs.image_tag }}

jobs:
  package:
    name: Build & package
    runs-on: ubuntu-latest

    permissions:
      contents: read  # Required to check out the code.
      packages: write # Required to restore private packages and push to GHCR.

    env:
      CONTAINER_REGISTRY: ghcr.io

    outputs:
      image_tag: ${{ steps.image_tags.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v5

      - name: Add DfEDigital NuGet Feed Credentials
        run: |
          dotnet nuget update source dfedigital \
            --configfile ./app/nuget.config \
            --username USERNAME \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - run: just package -c Release -o ${{ github.workspace }}/publish

      - uses: actions/upload-artifact@v6
        id: upload_app
        with:
          name: web_package
          path: publish
          if-no-files-found: error

      - name: Get Docker image tag
        id: image_tags
        run: |
          echo "tag=$CONTAINER_REGISTRY/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build app \
            --file app/Dockerfile \
            --secret id=nuget_config,src=app/nuget.config \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --tag "$TAG"
        env:
          TAG: ${{ steps.image_tags.outputs.tag }}

      - name: Push Docker image
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: docker push "$TAG"
        env:
          TAG: ${{ steps.image_tags.outputs.tag }}

      - name: Verify image in GitHub Container Registry
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: |
          docker manifest inspect "$TAG" > /dev/null
          echo "Published Docker image: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ steps.image_tags.outputs.tag }}
