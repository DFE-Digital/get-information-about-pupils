services:
  # Note: there are no backing services here. The Cosmos DB emulator is started per test run
  # through Testcontainers (see CosmosDbEmulator), which is why the test container below is
  # given the Docker socket. The Azure Search index is stubbed in-process (see
  # AzureSearchIndexStub), so it needs no container and no certificate.
  integration-tests:
    image: giapweb-core-integration-tests:latest
    build:
      context: .
      dockerfile: Dockerfile.IntegrationTests
      secrets:
        - nuget_config
    network_mode: host
    volumes:
      # Testcontainers starts the Cosmos DB emulator as a sibling container on the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Test coverage reports
      - type: bind
        source: coverage-integration/
        target: /coverage-integration

# uses Docker BuildKit - not available at runtime or part of image layers
secrets:
  nuget_config:
    file: DfE.GIAP.All/nuget.config
